<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Refine settings</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f4f6f2;color:#18352b;font:15px/1.5 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:680px;margin:64px auto;padding:0 20px}.card{background:#fff;border:1px solid #e1e9e3;border-radius:22px;padding:30px;box-shadow:0 16px 40px #153b2910}.brand{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:#078060;font-weight:800}h1{margin:8px 0;font-size:30px}p{color:#63736a}label{display:block;font-weight:650;margin:24px 0 8px}input{width:100%;padding:13px 14px;border:1px solid #cbd8cf;border-radius:11px;font:inherit}button{margin-top:16px;padding:12px 18px;background:#08795b;border:0;border-radius:11px;color:#fff;font:inherit;font-weight:700;cursor:pointer}.notice{margin-top:16px;min-height:22px;color:#08795b}.privacy{padding:15px;background:#f3f8f4;border-radius:12px;font-size:13px}
  </style>
</head>
<body><main class="wrap"><section class="card"><div class="brand">✳ Refine</div><h1>Private by design.</h1><p>Connect the extension to your local Refine API. Draft text stays on this device.</p><label for="api">Refine API address</label><input id="api" type="url" spellcheck="false" placeholder="http://localhost:8000"/><button id="save">Save address</button><div id="notice" class="notice" role="status"></div><div class="privacy">Use a loopback address such as <b>http://localhost:8000</b>. The extension sends drafts only to this API.</div></section></main><script src="options.js"></script></body></html>

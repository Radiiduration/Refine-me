name: Refine
options:
  bundleIdPrefix: com.refine
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: 5.0
    IPHONEOS_DEPLOYMENT_TARGET: 16.0
    CODE_SIGN_STYLE: Automatic
targets:
  Refine:
    type: application
    platform: iOS
    sources:
      - path: RefineApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.refine.writing
        INFOPLIST_FILE: RefineApp/Info.plist
        CODE_SIGN_ENTITLEMENTS: RefineApp/Refine.entitlements
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - target: RefineKeyboard
        embed: true
  RefineKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - path: RefineKeyboard
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.refine.writing.keyboard
        INFOPLIST_FILE: RefineKeyboard/Info.plist
        CODE_SIGN_ENTITLEMENTS: RefineKeyboard/RefineKeyboard.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        GENERATE_INFOPLIST_FILE: NO
